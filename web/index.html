<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paint Passport</title>
  <meta name="description" content="Paintings from your device, and a way to send images back to it." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A8%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Fraunces"', 'ui-serif', 'Georgia', 'serif'],
            sans: ['"Inter"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          colors: {
            paper: '#faf6ee',
            ink: {
              50: '#eef2ee',
              100: '#d9e3d9',
              300: '#8fac91',
              500: '#4c6b4f',
              700: '#2c4a30',
              800: '#223a26',
              900: '#1b2e1f',
            },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-paper font-sans text-stone-800 antialiased">
  <div class="mx-auto max-w-3xl px-5 pb-24 pt-16 sm:px-8">

    <header class="mb-14 text-center">
      <span class="inline-block -rotate-2 rounded-full border border-ink-700/30 bg-ink-700/5 px-3 py-1 text-[11px] font-semibold uppercase tracking-widest text-ink-700">
        Est. 2026 · No. 001
      </span>
      <h1 class="mt-4 font-serif text-4xl font-semibold tracking-tight text-ink-900 sm:text-5xl">
        Paint&nbsp;Passport
      </h1>
      <p class="mx-auto mt-3 max-w-md text-sm text-stone-500 sm:text-base">
        Paintings from your device, stamped and collected here - and a way to send
        images back to it.
      </p>
    </header>

    <main class="space-y-16">
      <section aria-labelledby="send-heading">
        <h2 id="send-heading" class="font-serif text-xl font-semibold text-ink-900">
          Send an image to a device
        </h2>
        <div class="mt-4 rounded-2xl border border-stone-200 bg-white/70 p-6 shadow-sm sm:p-8">
          <form id="send-form" class="space-y-5">
            <div class="grid gap-5 sm:grid-cols-2">
              <label class="block">
                <span class="mb-1 block text-sm font-medium text-stone-700">Device ID</span>
                <input type="text" id="device-id" placeholder="device-1" required
                  class="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm text-stone-800 placeholder:text-stone-400 focus:border-ink-700 focus:outline-none focus:ring-2 focus:ring-ink-700/20" />
              </label>
              <label class="block">
                <span class="mb-1 block text-sm font-medium text-stone-700">Web key</span>
                <input type="password" id="web-key" placeholder="shared web key" required
                  class="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm text-stone-800 placeholder:text-stone-400 focus:border-ink-700 focus:outline-none focus:ring-2 focus:ring-ink-700/20" />
              </label>
            </div>
            <label class="block">
              <span class="mb-1 block text-sm font-medium text-stone-700">Image</span>
              <input type="file" id="image-file" accept="image/*" required
                class="block w-full text-sm text-stone-600 file:mr-4 file:rounded-lg file:border-0 file:bg-ink-800 file:px-4 file:py-2 file:text-sm file:font-medium file:text-white hover:file:bg-ink-700" />
            </label>
            <button type="submit"
              class="inline-flex items-center justify-center rounded-lg bg-ink-800 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-ink-700 focus:outline-none focus:ring-2 focus:ring-ink-700/40">
              Send to device
            </button>
            <p id="send-status" class="min-h-[1.25rem] text-sm text-stone-500"></p>
          </form>
        </div>
      </section>

      <section aria-labelledby="gallery-heading">
        <h2 id="gallery-heading" class="font-serif text-xl font-semibold text-ink-900">
          Gallery
        </h2>
        <div class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-end">
          <label class="block flex-1">
            <span class="mb-1 block text-sm font-medium text-stone-700">Filter by device</span>
            <input type="text" id="filter-device" placeholder="leave blank for all devices"
              class="w-full rounded-lg border border-stone-300 bg-white px-3 py-2 text-sm text-stone-800 placeholder:text-stone-400 focus:border-ink-700 focus:outline-none focus:ring-2 focus:ring-ink-700/20" />
          </label>
          <button id="refresh-btn" type="button"
            class="rounded-lg border border-stone-300 bg-white px-4 py-2 text-sm font-medium text-stone-700 transition hover:bg-stone-50">
            Refresh
          </button>
        </div>
        <div id="gallery" class="mt-6 grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4"></div>
      </section>
    </main>

    <footer class="mt-20 text-center text-xs text-stone-400">
      Paint Passport - Made by Jon Osorio.
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
